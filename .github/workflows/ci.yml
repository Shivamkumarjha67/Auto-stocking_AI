name: AutoStock-AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize SQLite Mock DB
        run: |
          python -c "import sqlite3; conn = sqlite3.connect('data/mock_db/warehouse.db'); f_schema = open('data/mock_db/schema.sql').read(); f_seed = open('data/mock_db/seed_data.sql').read(); conn.executescript(f_schema); conn.executescript(f_seed); conn.close(); print('Database seeded successfully.')"

      - name: Run Test Suite
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || 'dummy_test_key' }}
        run: |
          pytest tests/ -v

